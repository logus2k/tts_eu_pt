[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tts_eu_pt"
version = "0.1.0"
description = "A permissively-licensed European Portuguese (pt-PT) text-to-speech voice, fine-tuned from Kokoro-82M."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Antonio Cruz", email = "logus2k@gmail.com" }]
maintainers = [{ name = "Antonio Cruz", email = "logus2k@gmail.com" }]
keywords = ["tts", "text-to-speech", "portuguese", "pt-pt", "european-portuguese", "kokoro", "speech-synthesis"]
classifiers = [
    # "Early release" per the README -- Alpha, not Beta.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    # Only "Python :: 3" -- no per-minor classifiers, since the package has been exercised
    # on 3.12 alone. requires-python already advertises the >=3.10 floor.
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Natural Language :: Portuguese",
]
dependencies = [
    "torch>=2.1",
    "numpy",
    "soundfile",
    "transformers>=4.40",
    "huggingface_hub>=0.23",
    "loguru",
    # European-Portuguese G2P front-end (Apache-2.0). The sub-regional lects (pt-PT-x-lisbon)
    # require the 1.2 alpha or newer; the older stable release silently ignores them.
    "tugaphone>=1.2.0a1",
    "num2words",
]

[project.optional-dependencies]
# For tts_eu_pt/server.py (the web-echo demo backend).
server = ["fastapi", "uvicorn[standard]"]

[project.urls]
Homepage = "https://github.com/logus2k/tts_eu_pt"
Source = "https://github.com/logus2k/tts_eu_pt"

[project.scripts]
# Must point INSIDE the package: a script target that is not in [tool.setuptools].packages
# installs fine and then dies at run time with ModuleNotFoundError.
tts-eu-pt = "tts_eu_pt.cli:main"

[tool.setuptools]
packages = ["tts_eu_pt", "tts_eu_pt.kokoro"]

[tool.setuptools.package-data]
# The web-echo page is served by tts_eu_pt.server from the installed package, so it has to
# ship in the wheel alongside the JSON assets.
tts_eu_pt = ["assets/*.json", "web/*"]
